name: CAT-Q checks

on:
  push:
    branches:
      - main
    paths:
      - "projects/cat-q/**"
      - ".github/workflows/cat-q.yml"
  pull_request:
    paths:
      - "projects/cat-q/**"
      - ".github/workflows/cat-q.yml"

jobs:
  release-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cat-q

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight test dependency
        run: python -m pip install PyYAML

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run public release contract tests
        run: python -m unittest discover -s tests -p "test_*.py"
